# PARA ACTIVARLO: copia este archivo a .github/workflows/backup.yml en GitHub (Add file → Create new file).
# Se guarda aquí porque la credencial local no tiene permiso para crear flujos de GitHub Actions.

# Respaldo semanal cifrado de la base del LMS (además de los respaldos diarios de Supabase Pro).
# Se guarda como artefacto privado del repositorio por 90 días. Necesita dos secretos del repositorio:
#   SUPABASE_DB_PASSWORD  y  BACKUP_PASSPHRASE   (Settings → Secrets and variables → Actions)
name: Respaldo semanal

on:
  schedule:
    - cron: "0 9 * * 0"   # domingos 03:00 en Ciudad de México
  workflow_dispatch:

permissions:
  contents: read

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://srehmgbcujdixhyygnmd.supabase.co
      SUPABASE_DB_HOST: aws-0-us-east-1.pooler.supabase.com
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Revisar configuración
        id: cfg
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Faltan los secretos SUPABASE_DB_PASSWORD y BACKUP_PASSPHRASE; no se hizo el respaldo."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        if: steps.cfg.outputs.ok == 'true'
        run: npm ci --ignore-scripts
      - name: Respaldar y cifrar
        if: steps.cfg.outputs.ok == 'true'
        run: node scripts/db-backup.mjs --out respaldo
      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          name: respaldo-lms-${{ github.run_number }}
          path: respaldo/*.lmsbk
          retention-days: 90
          if-no-files-found: error
